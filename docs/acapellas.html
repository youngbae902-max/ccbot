<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Acapellas • CC</title>
<style>
:root {
  --site-primary: #9dff65;
  --site-secondary: #222b22;
  --site-background: #101310;
  --site-on-primary: #11170e;
  --site-on-secondary: #eff6ec;
  --site-on-background: #f3f6f1;
  --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-font-heading: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--site-background); color: var(--site-on-background); font-family: var(--site-font-body); }
.app { min-height: 100vh; width: 100%; background-color: var(--site-background); padding: calc(28px * var(--site-spacing-scale)) max(16px, calc((100vw - 1100px) / 2)); }
header { padding: calc(22px * var(--site-spacing-scale)) 0 24px; }
.brand { display: inline-flex; gap: 9px; align-items: center; color: var(--site-primary); font-size: 12px; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
h1 { font-family: var(--site-font-heading); font-size: calc(clamp(32px, 6vw, 54px) * var(--site-heading-scale)); line-height: 1.02; letter-spacing: -.05em; margin: 14px 0 10px; }
.subtitle { color: light-dark(#626b60, #aab3a7); max-width: 540px; margin: 0; line-height: 1.6; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0; }
.search { flex: 1 1 240px; min-width: 0; border: 1px solid light-dark(#d8dfd5, #343b33); background: light-dark(#fff, #191d18); color: light-dark(#172016, #f3f6f1); border-radius: calc(14px * var(--site-radius-scale)); padding: 14px 15px; font: inherit; outline: none; }
.search:focus { border-color: var(--site-primary); box-shadow: 0 0 0 3px #9dff6520; }
.count { align-self: center; color: light-dark(#626b60, #aab3a7); font-size: 13px; padding: 0 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: calc(16px * var(--site-spacing-scale)); }
.card { overflow: hidden; border: 1px solid light-dark(#dfe4dc, #30372f); border-radius: calc(18px * var(--site-radius-scale)); background: light-dark(#fff, #191d18); color: light-dark(#172016, #f3f6f1); text-decoration: none; transition: transform .16s ease, border-color .16s ease; }
.card:hover { transform: translateY(-3px); border-color: var(--site-primary); }
.photo-wrap { position: relative; aspect-ratio: 4 / 4.4; overflow: hidden; background: var(--site-secondary); }
.photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: var(--site-primary); font-size: 46px; font-weight: 900; }
.card-body { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px; }
.name { font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
.arrow { color: var(--site-primary); font-size: 20px; font-weight: 900; }
.state { border: 1px dashed light-dark(#cfd8ca, #3a4438); color: light-dark(#626b60, #aab3a7); border-radius: 16px; padding: 30px 20px; text-align: center; grid-column: 1 / -1; line-height: 1.6; }
footer { padding: 30px 0 10px; color: light-dark(#7a8377, #788174); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<main class="app" data-sites-preview-theme="custom">
  <header>
    <div class="brand"><span>●</span> CC · CATÁLOGO MUSICAL</div>
    <h1>Acapellas<span style="color:var(--site-primary)">.</span></h1>
    <p class="subtitle">Escolha o MC para abrir o link da acapella. O catálogo é atualizado conforme os novos nomes são cadastrados.</p>
  </header>
  <section class="toolbar" aria-label="Buscar MCs">
    <input class="search" id="search" type="search" placeholder="Pesquisar MC..." aria-label="Pesquisar MC">
    <span class="count" id="count">Carregando catálogo…</span>
  </section>
  <section class="grid" id="grid" aria-live="polite"><div class="state">Carregando acapellas…</div></section>
  <footer>CC ® · ACAPELLAS DE MCs</footer>
</main>
<script>
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");
let items = [];
function render() {
  const term = search.value.trim().toLocaleLowerCase("pt-BR");
  const filtered = items.filter(item => String(item.nome || "").toLocaleLowerCase("pt-BR").includes(term));
  count.textContent = filtered.length + (filtered.length === 1 ? " MC" : " MCs");
  grid.replaceChildren();
  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "state";
    empty.textContent = items.length ? "Nenhum MC encontrado. Tente outro nome." : "Ainda não há MCs cadastrados. Volte mais tarde.";
    grid.append(empty);
    return;
  }
  for (const item of filtered) {
    const link = document.createElement("a");
    link.className = "card";
    link.href = item.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.setAttribute("aria-label", "Abrir acapella de " + item.nome);
    const wrap = document.createElement("div");
    wrap.className = "photo-wrap";
    if (item.foto) {
      const img = document.createElement("img");
      img.className = "photo";
      img.src = item.foto;
      img.alt = item.nome;
      img.loading = "lazy";
      img.onerror = () => { wrap.replaceChildren(); const fallback = document.createElement("div"); fallback.className = "photo-placeholder"; fallback.textContent = String(item.nome || "?").trim().charAt(0).toUpperCase(); wrap.append(fallback); };
      wrap.append(img);
    } else {
      const fallback = document.createElement("div");
      fallback.className = "photo-placeholder";
      fallback.textContent = String(item.nome || "?").trim().charAt(0).toUpperCase();
      wrap.append(fallback);
    }
    const body = document.createElement("div");
    body.className = "card-body";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.nome || "MC sem nome";
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "↗";
    body.append(name, arrow);
    link.append(wrap, body);
    grid.append(link);
  }
}
search.addEventListener("input", render);
fetch("./acapellas.json", {cache:"no-store"})
  .then(response => { if (!response.ok) throw new Error("Catálogo indisponível"); return response.json(); })
  .then(data => { items = Array.isArray(data) ? data.filter(x => x && x.nome && x.link) : []; render(); })
  .catch(() => { count.textContent = ""; grid.innerHTML = '<div class="state">Não foi possível carregar o catálogo agora.</div>'; });
</script>
</body>
</html>
