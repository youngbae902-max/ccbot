name: Python syntax check
on:
  push:
    branches: [master, "maintenance/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot source
        run: python -m py_compile ccbot.py github_bridge.py
