name: CC BOT checks

on:
  push:
    branches: ["master", "feat/**", "maintenance/**"]
  pull_request:
    branches: ["master"]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile ccbot.py
      - name: Run static tests
        run: python -m unittest discover -s tests -v
